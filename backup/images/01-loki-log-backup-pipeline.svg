  <rect x="40" y="360" width="400" height="40" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="240.0" y="384.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">보존기간 90일 초과 아카이브 자동 정리</text>
  <rect x="460" y="360" width="400" height="40" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="660.0" y="384.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">검증 2단계 모두 통과해야 원본 삭제</text>
