  <text x="100.0" y="112.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">Java 앱 × N</text>
  <text x="100.0" y="124.6" text-anchor="middle" font-size="8.5" fill="#991b1b">log4j debug</text>
