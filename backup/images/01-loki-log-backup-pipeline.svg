  <text x="658.5" y="298.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">NFS 전송</text>
  <text x="658.5" y="310.6" text-anchor="middle" font-size="8.5" fill="#1e40af">2차: md5sum 비교</text>
  <line x1="582.0" y1="300.0" x2="596.0" y2="300.0" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <rect x="735.0" y="270" width="125.0" height="60" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
