<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1100" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="13" font-weight="bold" fill="#111827">오픈소스 · 상용 백업 솔루션 교차 검증 흐름</text>

  <!-- Track A: Velero -->
  <text x="20" y="55" font-size="11" font-weight="bold" fill="#1e3a8a">오픈소스 — Velero + MinIO (SaaS·그룹사 대상)</text>
  <rect x="20" y="65" width="160" height="50" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">네임스페이스/전체</text>
  <text x="100" y="100" text-anchor="middle" font-size="9.5" fill="#1e40af">클러스터 마이그레이션</text>

  <line x1="180" y1="90" x2="210" y2="90" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="210" y="65" width="180" height="50" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="300" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">모듈별 정합성 비교</text>
  <text x="300" y="100" text-anchor="middle" font-size="9.5" fill="#1e40af">Redis/MariaDB/ES/Kafka 1:1</text>

  <line x1="390" y1="90" x2="420" y2="90" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="420" y="65" width="190" height="50" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="515" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">hostPath 볼륨 백업 불가</text>
  <text x="515" y="100" text-anchor="middle" font-size="9.5" fill="#991b1b">restic 파일시스템 백업 확인</text>

  <!-- Track B: Kasten -->
  <text x="20" y="150" font-size="11" font-weight="bold" fill="#7c2d12">상용 — Veeam Kasten (구축형 고객사 대상)</text>
  <rect x="20" y="160" width="160" height="50" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="100" y="181" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7c2d12">Active IDC → DR IDC</text>
  <text x="100" y="195" text-anchor="middle" font-size="9.5" fill="#9a3412">클러스터 간 DR 복구</text>

  <line x1="180" y1="185" x2="210" y2="185" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="210" y="160" width="180" height="50" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="300" y="181" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7c2d12">백업/복구 성능 측정</text>
  <text x="300" y="195" text-anchor="middle" font-size="9.5" fill="#9a3412">전체 스냅샷 2-3분</text>

  <line x1="390" y1="185" x2="420" y2="185" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="420" y="160" width="190" height="50" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="515" y="181" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">hostPath 볼륨 백업 불가</text>
  <text x="515" y="195" text-anchor="middle" font-size="9.5" fill="#991b1b">Kasten으로도 동일 제약</text>

  <!-- Convergence -->
  <line x1="515" y1="115" x2="515" y2="140" stroke="#16a34a" stroke-width="1.8"/>
  <line x1="515" y1="160" x2="515" y2="140" stroke="#16a34a" stroke-width="1.8"/>
  <line x1="610" y1="90" x2="700" y2="90" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="610" y1="185" x2="700" y2="185" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="700" y1="90" x2="700" y2="185" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="700" y1="137" x2="740" y2="137" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a1)"/>

  <rect x="740" y="105" width="330" height="65" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="905" y="128" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">도구 한계가 아닌 StorageClass(hostPath) 구조적 제약</text>
  <text x="905" y="144" text-anchor="middle" font-size="9.5" fill="#166534">오픈소스·상용 독립 검증으로 교차 규명</text>
  <text x="905" y="158" text-anchor="middle" font-size="9.5" fill="#166534">→ 도구 편향 없는 도입 판단 근거 확보</text>

  <text x="20" y="250" font-size="10" fill="#64748b">파란 경로 = Velero(MinIO) 검증 · 주황 경로 = Veeam Kasten 검증 · 초록 = 두 경로가 독립적으로 수렴한 결론</text>
  <text x="20" y="266" font-size="10" fill="#64748b">Kasten 성능: 전체 백업 2-3분 · 2차 스토리지 자동 소산 2-3분 · DR 복구 3-4분(대형 컴포넌트 최대 약 12분)</text>
</svg>
