  <rect x="450" y="226" width="150" height="50" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="525.0" y="249.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">PVC (RWO)</text>
  <text x="525.0" y="261.6" text-anchor="middle" font-size="8.5" fill="#1e40af">/data</text>
  <line x1="624" y1="190" x2="600" y2="240" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-blue)"/>
  <rect x="640" y="232" width="220" height="50" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="750.0" y="255.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Replica 순차 Scale-out</text>
  <text x="750.0" y="267.6" text-anchor="middle" font-size="8.5" fill="#166534">Master로부터 복제 동기화</text>
  <line x1="760" y1="210" x2="760" y2="232" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
  <rect x="20" y="314" width="520" height="112" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="36" y="338" font-size="12.5" font-weight="bold" fill="#7f1d1d">AS-IS · Scale-down 후 볼륨 직접 주입 시도</text>
  <rect x="40" y="356" width="150" height="50" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="115.0" y="379.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">StatefulSet</text>
  <text x="115.0" y="391.6" text-anchor="middle" font-size="8.5" fill="#991b1b">replicas: 0</text>
  <rect x="220" y="356" width="300" height="50" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="370.0" y="379.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">RWO 블록 볼륨</text>
  <text x="370.0" y="391.6" text-anchor="middle" font-size="8.5" fill="#991b1b">Pod 미기동 → 외부·임시 Pod 마운트 불가</text>
  <line x1="190" y1="381" x2="220" y2="381" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-red)"/>
  <rect x="560" y="314" width="320" height="112" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="576" y="338" font-size="12.5" font-weight="bold" fill="#1e3a8a">정합성 검증</text>
  <rect x="580" y="356" width="280" height="50" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="720.0" y="385.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">복제 로그 + Redis key 개수 비교</text>
