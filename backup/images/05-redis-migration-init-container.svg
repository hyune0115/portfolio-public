  <rect x="40" y="230" width="160" height="44" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="120.0" y="250.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">dump.rdb</text>
  <text x="120.0" y="262.6" text-anchor="middle" font-size="8.5" fill="#92400e">최종 스냅샷</text>
  <line x1="120" y1="140" x2="120" y2="160" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-gray)"/>
  <line x1="120" y1="210" x2="120" y2="230" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-gray)"/>
  <rect x="250" y="150" width="150" height="70" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="325.0" y="177.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">전송</text>
  <text x="325.0" y="189.9" text-anchor="middle" font-size="8.5" fill="#92400e">kubectl cp → 로컬</text>
  <text x="325.0" y="201.3" text-anchor="middle" font-size="8.5" fill="#92400e">scp → 대상 노드 hostPath</text>
