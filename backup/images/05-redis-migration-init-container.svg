  <text x="446" y="72" font-size="12.5" font-weight="bold" fill="#14532d">Cluster B (신규)</text>
  <rect x="450" y="90" width="130" height="44" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="515.0" y="110.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">노드 hostPath</text>
  <text x="515.0" y="122.6" text-anchor="middle" font-size="8.5" fill="#92400e">dump.rdb</text>
  <line x1="400" y1="185" x2="450" y2="120" stroke="#d97706" stroke-width="1.4" marker-end="url(#a-amber)"/>
  <rect x="610" y="80" width="250" height="130" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="735.0" y="149.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d"></text>
  <text x="624" y="100" text-anchor="start" font-size="11" font-weight="bold" fill="#166534">Redis Master Pod</text>
  <rect x="624" y="110" width="222" height="40" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="735.0" y="128.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Init Container</text>
  <text x="735.0" y="140.6" text-anchor="middle" font-size="8.5" fill="#166534">hostPath → /data 복사</text>
  <rect x="624" y="160" width="222" height="40" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="735.0" y="178.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">redis 메인 컨테이너</text>
  <text x="735.0" y="190.6" text-anchor="middle" font-size="8.5" fill="#166534">기동 시 dump.rdb 자동 로드</text>
  <line x1="580" y1="120" x2="624" y2="130" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
