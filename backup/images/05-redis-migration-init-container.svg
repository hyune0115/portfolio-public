  <rect x="40" y="96" width="160" height="44" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="120.0" y="122.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">트래픽 차단</text>
  <rect x="40" y="160" width="160" height="50" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
