<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1100" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="13" font-weight="bold" fill="#111827">Before — 공용 root Access Token</text>
  <rect x="20" y="40" width="150" height="44" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="95" y="59" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">root 계정</text>
  <text x="95" y="75" text-anchor="middle" font-size="9" fill="#991b1b">단일 공용 Token</text>

  <line x1="170" y1="55" x2="230" y2="35" stroke="#dc2626" stroke-width="1.3" marker-end="url(#a1)"/>
  <line x1="170" y1="60" x2="230" y2="60" stroke="#dc2626" stroke-width="1.3" marker-end="url(#a1)"/>
  <line x1="170" y1="65" x2="230" y2="85" stroke="#dc2626" stroke-width="1.3" marker-end="url(#a1)"/>

  <rect x="230" y="22" width="240" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="350" y="39" text-anchor="middle" font-size="9.5" fill="#7f1d1d">프로젝트 A (Update Agent + ArgoCD)</text>
  <rect x="230" y="48" width="240" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="350" y="65" text-anchor="middle" font-size="9.5" fill="#7f1d1d">프로젝트 B (Update Agent + ArgoCD)</text>
  <rect x="230" y="74" width="240" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="350" y="91" text-anchor="middle" font-size="9.5" fill="#7f1d1d">... 약 750개 프로젝트</text>

  <rect x="500" y="40" width="230" height="60" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="615" y="62" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">Token 1개 유출 시</text>
  <text x="615" y="78" text-anchor="middle" font-size="9.5" fill="#991b1b">전체 Repository write 권한 노출</text>
  <text x="615" y="92" text-anchor="middle" font-size="9.5" fill="#991b1b">감사 추적 불가</text>

  <line x1="470" y1="70" x2="500" y2="70" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/>

  <line x1="20" y1="130" x2="1080" y2="130" stroke="#e2e8f0" stroke-width="1"/>

  <text x="20" y="154" font-size="13" font-weight="bold" fill="#111827">After — 프로젝트별 분리 발급 Project Access Token</text>

  <rect x="20" y="170" width="150" height="44" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="95" y="189" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">부트스트랩 계정</text>
  <text x="95" y="205" text-anchor="middle" font-size="9" fill="#1e40af">단기 발급, 즉시 파기</text>

  <line x1="170" y1="192" x2="230" y2="192" stroke="#334155" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="230" y="165" width="230" height="26" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="345" y="182" text-anchor="middle" font-size="9.5" fill="#14532d">프로젝트 A · push(write_repository)</text>
  <rect x="230" y="195" width="230" height="26" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="345" y="212" text-anchor="middle" font-size="9.5" fill="#14532d">프로젝트 A · pull(read_repository)</text>

  <rect x="480" y="165" width="230" height="26" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="595" y="182" text-anchor="middle" font-size="9.5" fill="#14532d">프로젝트 B · push(write_repository)</text>
  <rect x="480" y="195" width="230" height="26" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="595" y="212" text-anchor="middle" font-size="9.5" fill="#14532d">프로젝트 B · pull(read_repository)</text>

  <line x1="730" y1="192" x2="760" y2="192" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <rect x="760" y="170" width="230" height="60" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="875" y="192" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">유출 시 영향 범위</text>
  <text x="875" y="208" text-anchor="middle" font-size="9.5" fill="#166534">전 프로젝트 → 단일 프로젝트</text>
  <text x="875" y="222" text-anchor="middle" font-size="9.5" fill="#166534">Ansible로 신규 프로젝트 자동 발급</text>

  <text x="20" y="260" font-size="10" fill="#64748b">Pull 토큰은 ArgoCD values 조각으로 커밋 이력에 남지 않도록 전달, Push 토큰은 Sealed Secret으로 암호화해 저장소에 반영</text>
  <text x="20" y="276" font-size="10" fill="#64748b">GitLab 13.10 레거시로 access_level 세부 지정·Rotation API 미지원 — 잔존 위험으로 명시적 문서화, GIT_ASKPASS로 URL/config에 토큰 노출 경로 제거</text>
</svg>
