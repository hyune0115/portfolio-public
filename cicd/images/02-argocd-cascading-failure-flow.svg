<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1100" height="260" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="13" font-weight="bold" fill="#111827">장애 연쇄 흐름</text>

  <!-- Step boxes -->
  <rect x="20" y="45" width="150" height="55" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="95" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">과도한 Git 조회</text>
  <text x="95" y="83" text-anchor="middle" font-size="9.5" fill="#1e40af">짧은 reconciliation</text>

  <line x1="170" y1="72" x2="200" y2="72" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="200" y="45" width="150" height="55" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="275" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">GitLab 부하 증가</text>
  <text x="275" y="83" text-anchor="middle" font-size="9.5" fill="#9a3412">수백 App 동시 조회</text>

  <line x1="350" y1="72" x2="380" y2="72" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="380" y="45" width="150" height="55" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="455" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">HTTP 502</text>
  <text x="455" y="83" text-anchor="middle" font-size="9.5" fill="#991b1b">Git 요청 실패</text>

  <line x1="530" y1="72" x2="560" y2="72" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="560" y="45" width="150" height="55" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="635" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">인증 실패</text>
  <text x="635" y="83" text-anchor="middle" font-size="9.5" fill="#991b1b">credential 오류 처리</text>

  <line x1="710" y1="72" x2="740" y2="72" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="740" y="45" width="150" height="55" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="815" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">credential 자동 삭제</text>
  <text x="815" y="83" text-anchor="middle" font-size="9.5" fill="#991b1b">store 저장 방식 취약</text>

  <line x1="815" y1="100" x2="815" y2="130" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="740" y="130" width="150" height="55" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="815" y="153" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">Sync 장애 장기화</text>
  <text x="815" y="169" text-anchor="middle" font-size="9.5" fill="#991b1b">일일 4-5개 고객사 영향</text>

  <!-- Fix arrow -->
  <line x1="740" y1="157" x2="120" y2="157" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a1)"/>
  <text x="410" y="147" text-anchor="middle" font-size="10" fill="#166534">개선: retry 정책 + credential.helper cache 전환으로 연쇄 고리 차단</text>

  <rect x="20" y="130" width="150" height="55" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="95" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">일일 1개 수준</text>
  <text x="95" y="169" text-anchor="middle" font-size="9.5" fill="#166534">75-80% 감소</text>

  <text x="20" y="220" font-size="10" fill="#64748b">빨간 경로 = 개선 전 연쇄 장애 · 초록 경로 = 개선 후 (Repository URL 정리, reconciliation 주기 조정 병행)</text>
</svg>
