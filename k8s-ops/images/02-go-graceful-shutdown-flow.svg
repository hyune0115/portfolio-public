<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#111827">컨테이너 종료 흐름 — 쉘 PID 1 vs dumb-init + graceful shutdown</text>
  <rect x="20" y="48" width="420" height="364" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="36" y="72" font-size="12.5" font-weight="bold" fill="#7f1d1d">AS-IS · 쉘 스크립트가 PID 1</text>
  <rect x="60" y="96" width="340" height="40" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="230.0" y="120.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">kubelet → SIGTERM</text>
  <rect x="60" y="160" width="340" height="50" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="230.0" y="183.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">PID 1: 쉘 스크립트</text>
  <text x="230.0" y="195.6" text-anchor="middle" font-size="8.5" fill="#991b1b">exec 없이 Go 앱을 fork</text>
  <rect x="60" y="236" width="160" height="50" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="140.0" y="259.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">Go 앱</text>
  <text x="140.0" y="271.6" text-anchor="middle" font-size="8.5" fill="#991b1b">시그널 핸들러 없음</text>
  <rect x="240" y="236" width="160" height="50" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="320.0" y="259.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">종료된 자식</text>
  <text x="320.0" y="271.6" text-anchor="middle" font-size="8.5" fill="#991b1b">reap 안 됨 → 좀비</text>
  <line x1="230" y1="136" x2="230" y2="160" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-red)"/>
  <line x1="140" y1="210" x2="140" y2="236" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-red)"/>
  <text x="148" y="226" text-anchor="start" font-size="9.5" fill="#991b1b">SIGTERM 미전파</text>
  <rect x="60" y="310" width="340" height="40" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="230.0" y="334.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">좀비 누적 → CPU I/O wait 과점유</text>
  <rect x="60" y="360" width="340" height="36" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="230.0" y="381.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">유예 30초(기본) 후 SIGKILL 강제 종료</text>
  <rect x="460" y="48" width="420" height="364" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="476" y="72" font-size="12.5" font-weight="bold" fill="#14532d">TO-BE · dumb-init + SIGTERM 핸들러</text>
  <rect x="500" y="96" width="340" height="40" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="670.0" y="114.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">preStop Hook</text>
  <text x="670.0" y="126.6" text-anchor="middle" font-size="8.5" fill="#166534">SIGTERM 전송 후 5초 대기</text>
  <rect x="500" y="160" width="340" height="50" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="670.0" y="183.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">PID 1: dumb-init</text>
  <text x="670.0" y="195.6" text-anchor="middle" font-size="8.5" fill="#166534">시그널 전파 + 자식 프로세스 reap</text>
  <rect x="500" y="236" width="340" height="50" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="670.0" y="259.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Go 앱 (os/signal 핸들러)</text>
  <text x="670.0" y="271.6" text-anchor="middle" font-size="8.5" fill="#166534">진행 중 요청 마무리 · 리소스 정리 후 종료</text>
  <line x1="670" y1="136" x2="670" y2="160" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
  <line x1="670" y1="210" x2="670" y2="236" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
  <text x="678" y="226" text-anchor="start" font-size="9.5" fill="#166534">SIGTERM 전파</text>
  <rect x="500" y="310" width="340" height="40" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="670.0" y="334.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">종료된 자식 자동 reap → 좀비 없음</text>
  <rect x="500" y="360" width="340" height="36" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="670.0" y="381.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">terminationGracePeriodSeconds: 60 — 초과 시에만 SIGKILL</text>
</svg>
