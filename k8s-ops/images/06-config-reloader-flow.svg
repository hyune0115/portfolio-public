  <text x="655.0" y="340.6" text-anchor="middle" font-size="9.5" fill="#991b1b">SIGHUP 처리 미구현</text>
  <text x="655.0" y="353.4" text-anchor="middle" font-size="9.5" fill="#991b1b">설정 반영에 Pod 재시작 필요</text>
