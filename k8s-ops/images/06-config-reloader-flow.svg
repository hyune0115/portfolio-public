<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#111827">ConfigMap/Secret 변경 반영 흐름 — 감지 자동화 + 재기동 수동 확인</text>
  <rect x="30" y="100" width="180" height="56" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="120.0" y="125.7" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">ConfigMap / Secret 변경</text>
  <text x="120.0" y="139.0" text-anchor="middle" font-size="9.5" fill="#1e40af">설정 추가·수정</text>
  <rect x="250" y="100" width="180" height="56" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="340.0" y="125.7" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Reloader</text>
  <text x="340.0" y="139.0" text-anchor="middle" font-size="9.5" fill="#1e40af">annotation 기반 변경 감지</text>
  <line x1="210" y1="128" x2="250" y2="128" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <rect x="470" y="100" width="180" height="56" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="560.0" y="125.7" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">관리자 확인</text>
  <text x="560.0" y="139.0" text-anchor="middle" font-size="9.5" fill="#92400e">설정값 반영 내용 검증</text>
  <line x1="430" y1="128" x2="470" y2="128" stroke="#d97706" stroke-width="1.4" marker-end="url(#a-amber)"/>
  <rect x="690" y="100" width="180" height="56" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="780.0" y="125.7" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">워크로드 재기동</text>
  <text x="780.0" y="139.0" text-anchor="middle" font-size="9.5" fill="#92400e">수동 rollout restart</text>
  <line x1="650" y1="128" x2="690" y2="128" stroke="#d97706" stroke-width="1.4" marker-end="url(#a-amber)"/>
  <path d="M30,84 L30,76 L430,76 L430,84" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <text x="230" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">자동 (구현 범위)</text>
  <path d="M470,84 L470,76 L870,76 L870,84" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="670" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">수동 (확인 후 실행)</text>
  <rect x="250" y="170" width="180" height="30" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="340.0" y="188.4" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">reloader.stakater.com/auto: "true"</text>
  <rect x="30" y="230" width="840" height="172" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="46" y="254" font-size="12.5" font-weight="bold" fill="#0f172a">SIGHUP 기반 무중단 반영 검토 결과</text>
  <text x="46" y="272" font-size="10.5" fill="#334155">재시작 없이 프로세스에 SIGHUP을 보내 설정만 다시 읽게 하는 방식</text>
  <rect x="60" y="292" width="370" height="88" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="245.0" y="327.3" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Nginx · Go 인증 모듈</text>
  <text x="245.0" y="340.6" text-anchor="middle" font-size="9.5" fill="#166534">SIGHUP 처리 구현됨</text>
  <text x="245.0" y="353.4" text-anchor="middle" font-size="9.5" fill="#166534">재시작 없이 설정 재적용 가능</text>
  <rect x="470" y="292" width="370" height="88" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
