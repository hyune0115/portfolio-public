<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="20" y="26" font-size="13" font-weight="bold" fill="#111827">마스터/워커 노드 분리 및 API 서버 HA — AS-IS vs TO-BE</text>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ========== AS-IS: all-master ========== -->
  <rect x="40" y="55" width="380" height="330" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="60" y="80" font-size="12" font-weight="bold" fill="#7f1d1d">AS-IS · all-master 구성</text>
  <text x="60" y="98" font-size="10.5" fill="#991b1b">마스터/워커 미분리, LB 이중화 없음</text>

  <rect x="180" y="115" width="80" height="36" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="220" y="137" text-anchor="middle" font-size="10" fill="#7f1d1d">Client</text>

  <rect x="130" y="200" width="90" height="46" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="175" y="220" text-anchor="middle" font-size="9.5" fill="#7f1d1d">node-01</text>
  <text x="175" y="234" text-anchor="middle" font-size="8.5" fill="#991b1b">master + worker</text>

  <rect x="230" y="200" width="90" height="46" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="275" y="220" text-anchor="middle" font-size="9.5" fill="#7f1d1d">node-02</text>
  <text x="275" y="234" text-anchor="middle" font-size="8.5" fill="#991b1b">master + worker</text>

  <rect x="130" y="270" width="90" height="46" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="175" y="290" text-anchor="middle" font-size="9.5" fill="#7f1d1d">node-03</text>
  <text x="175" y="304" text-anchor="middle" font-size="8.5" fill="#991b1b">master + worker</text>

  <rect x="230" y="270" width="90" height="46" rx="4" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="275" y="290" text-anchor="middle" font-size="9" fill="#991b1b">장애 시</text>
  <text x="275" y="304" text-anchor="middle" font-size="8.5" fill="#991b1b">다운타임 약 2분</text>

  <line x1="220" y1="151" x2="175" y2="200" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrowRed)"/>
  <line x1="220" y1="151" x2="275" y2="200" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrowRed)"/>
  <line x1="220" y1="151" x2="175" y2="270" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrowRed)"/>

  <text x="60" y="345" font-size="9.5" fill="#991b1b">· LB 이중화 없이 각 노드에 직접 연결</text>
  <text x="60" y="362" font-size="9.5" fill="#991b1b">· 컨트롤플레인/워커 부하가 한 노드에 혼재</text>

  <!-- ========== TO-BE: separated + HA ========== -->
  <rect x="460" y="55" width="400" height="330" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="480" y="80" font-size="12" font-weight="bold" fill="#14532d">TO-BE · 마스터/워커 분리 + HAProxy HA</text>
  <text x="480" y="98" font-size="10.5" fill="#166534">Keepalived VIP로 HAProxy 이중화, 컨트롤플레인 3식</text>

  <rect x="630" y="112" width="80" height="34" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="670" y="133" text-anchor="middle" font-size="10" fill="#14532d">Client</text>

  <rect x="620" y="160" width="100" height="32" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="670" y="180" text-anchor="middle" font-size="9.5" fill="#14532d">VIP :6443</text>

  <line x1="670" y1="146" x2="670" y2="160" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrowGreen)"/>

  <rect x="600" y="206" width="80" height="34" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="640" y="224" text-anchor="middle" font-size="9" fill="#14532d">HAProxy A</text>
  <text x="640" y="235" text-anchor="middle" font-size="7.5" fill="#166534">(MASTER)</text>

  <rect x="690" y="206" width="80" height="34" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="3,2"/>
  <text x="730" y="224" text-anchor="middle" font-size="9" fill="#166534">HAProxy B</text>
  <text x="730" y="235" text-anchor="middle" font-size="7.5" fill="#166534">(BACKUP)</text>

  <line x1="660" y1="192" x2="640" y2="206" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="680" y1="192" x2="720" y2="206" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="745" y="200" font-size="7.5" fill="#166534">VRRP</text>

  <rect x="480" y="270" width="90" height="40" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="525" y="286" text-anchor="middle" font-size="9" fill="#14532d">master-01</text>
  <text x="525" y="300" text-anchor="middle" font-size="7.5" fill="#166534">apiserver</text>

  <rect x="580" y="270" width="90" height="40" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="625" y="286" text-anchor="middle" font-size="9" fill="#14532d">master-02</text>
  <text x="625" y="300" text-anchor="middle" font-size="7.5" fill="#166534">apiserver</text>

  <rect x="680" y="270" width="90" height="40" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="725" y="286" text-anchor="middle" font-size="9" fill="#14532d">master-03</text>
  <text x="725" y="300" text-anchor="middle" font-size="7.5" fill="#166534">apiserver</text>

  <line x1="640" y1="240" x2="525" y2="270" stroke="#16a34a" stroke-width="1.1" marker-end="url(#arrowGreen)"/>
  <line x1="640" y1="240" x2="625" y2="270" stroke="#16a34a" stroke-width="1.1" marker-end="url(#arrowGreen)"/>
  <line x1="640" y1="240" x2="725" y2="270" stroke="#16a34a" stroke-width="1.1" marker-end="url(#arrowGreen)"/>

  <rect x="478" y="330" width="304" height="40" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="630" y="346" text-anchor="middle" font-size="9" fill="#1e3a8a">worker-01 / worker-02 / worker-03</text>
  <text x="630" y="360" text-anchor="middle" font-size="7.5" fill="#1e40af">애플리케이션 파드 실행 (컨트롤플레인과 분리)</text>

  <rect x="475" y="262" width="315" height="112" rx="6" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="482" y="256" font-size="8" fill="#64748b">Kubernetes Cluster</text>

  <text x="480" y="398" font-size="9.5" fill="#166534">노드 절체 최대 5초 (95.45% 감소), 증설 시 서비스 영향 없음</text>
</svg>
