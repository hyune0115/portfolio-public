<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="20" y="26" font-size="13" font-weight="bold" fill="#111827">마스터/워커 노드 분리 및 API 서버 HA — AS-IS vs TO-BE</text>

  <!-- AS-IS: all-master -->
  <rect x="40" y="55" width="380" height="330" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="60" y="80" font-size="12" font-weight="bold" fill="#7f1d1d">AS-IS · all-master 구성</text>
  <text x="60" y="98" font-size="10.5" fill="#991b1b">마스터/워커 미분리, LB 이중화 없음</text>

  <rect x="70" y="120" width="80" height="40" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="110" y="144" text-anchor="middle" font-size="10" fill="#7f1d1d">Client</text>

  <line x1="150" y1="140" x2="200" y2="140" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrowRed)"/>

  <rect x="200" y="190" width="90" height="46" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="245" y="210" text-anchor="middle" font-size="9.5" fill="#7f1d1d">node-01</text>
  <text x="245" y="224" text-anchor="middle" font-size="8.5" fill="#991b1b">master+worker</text>

  <rect x="200" y="250" width="90" height="46" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="245" y="270" text-anchor="middle" font-size="9.5" fill="#7f1d1d">node-02</text>
  <text x="245" y="284" text-anchor="middle" font-size="8.5" fill="#991b1b">master+worker</text>

  <rect x="200" y="310" width="90" height="46" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="245" y="330" text-anchor="middle" font-size="9.5" fill="#7f1d1d">node-03</text>
  <text x="245" y="344" text-anchor="middle" font-size="8.5" fill="#991b1b">master+worker</text>

  <line x1="200" y1="140" x2="200" y2="213" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="200" y1="140" x2="200" y2="273" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="200" y1="140" x2="200" y2="333" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="200" y1="213" x2="200" y2="213" stroke="#dc2626"/>

  <text x="320" y="400" font-size="9.5" fill="#991b1b">노드 장애 시 다운타임 최대 2분</text>

  <!-- TO-BE: separated + HA -->
  <rect x="460" y="55" width="400" height="330" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="480" y="80" font-size="12" font-weight="bold" fill="#14532d">TO-BE · 마스터/워커 분리 + HAProxy HA</text>
  <text x="480" y="98" font-size="10.5" fill="#166534">Keepalived VIP로 HAProxy 이중화, 컨트롤플레인 3식</text>

  <rect x="490" y="118" width="90" height="36" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="535" y="140" text-anchor="middle" font-size="10" fill="#14532d">Client</text>

  <line x1="580" y1="136" x2="630" y2="136" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrowGreen)"/>

  <rect x="630" y="118" width="100" height="36" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="680" y="140" text-anchor="middle" font-size="10" fill="#14532d">VIP :6443</text>

  <rect x="610" y="168" width="70" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="645" y="190" text-anchor="middle" font-size="9" fill="#14532d">HAProxy A</text>
  <text x="645" y="200" text-anchor="middle" font-size="7.5" fill="#166534">(MASTER)</text>

  <rect x="700" y="168" width="70" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="735" y="190" text-anchor="middle" font-size="9" fill="#14532d">HAProxy B</text>
  <text x="735" y="200" text-anchor="middle" font-size="7.5" fill="#166534">(BACKUP)</text>

  <line x1="680" y1="154" x2="645" y2="168" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="680" y1="154" x2="735" y2="168" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="745" y="163" font-size="7.5" fill="#166534">VRRP</text>

  <rect x="490" y="230" width="100" height="36" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="540" y="252" text-anchor="middle" font-size="9.5" fill="#14532d">master-01</text>

  <rect x="490" y="276" width="100" height="36" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="540" y="298" text-anchor="middle" font-size="9.5" fill="#14532d">master-02</text>

  <rect x="490" y="322" width="100" height="36" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="540" y="344" text-anchor="middle" font-size="9.5" fill="#14532d">master-03</text>

  <line x1="645" y1="204" x2="590" y2="248" stroke="#16a34a" stroke-width="1.1"/>
  <line x1="645" y1="204" x2="590" y2="294" stroke="#16a34a" stroke-width="1.1"/>
  <line x1="645" y1="204" x2="590" y2="340" stroke="#16a34a" stroke-width="1.1"/>

  <rect x="710" y="230" width="100" height="36" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="760" y="252" text-anchor="middle" font-size="9.5" fill="#1e3a8a">worker-01</text>

  <rect x="710" y="276" width="100" height="36" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="760" y="298" text-anchor="middle" font-size="9.5" fill="#1e3a8a">worker-02</text>

  <rect x="710" y="322" width="100" height="36" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="760" y="344" text-anchor="middle" font-size="9.5" fill="#1e3a8a">worker-03</text>

  <text x="480" y="400" font-size="9.5" fill="#166534">노드 절체 최대 5초 (95.45% 감소), 증설 시 서비스 영향 없음</text>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
