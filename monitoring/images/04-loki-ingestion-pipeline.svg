<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#111827">Loki 로그 적재 흐름과 Ingestion 제한 튜닝 지점</text>
  <rect x="20" y="70" width="108" height="62" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="74.0" y="93.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Promtail</text>
  <text x="74.0" y="105.9" text-anchor="middle" font-size="8.5" fill="#92400e">cri</text>
  <text x="74.0" y="117.3" text-anchor="middle" font-size="8.5" fill="#92400e">max_partial_lines: 50</text>
  <rect x="144" y="70" width="108" height="62" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="198.0" y="93.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Batch</text>
  <text x="198.0" y="105.9" text-anchor="middle" font-size="8.5" fill="#92400e">batchsize 8MB</text>
  <text x="198.0" y="117.3" text-anchor="middle" font-size="8.5" fill="#92400e">batchwait 1s</text>
  <line x1="128" y1="101" x2="144" y2="101" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <rect x="268" y="70" width="108" height="62" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="322.0" y="93.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">HTTP Push</text>
  <text x="322.0" y="105.9" text-anchor="middle" font-size="8.5" fill="#1e40af">POST /loki/api/v1/push</text>
  <text x="322.0" y="117.3" text-anchor="middle" font-size="8.5" fill="#1e40af">Protobuf + Snappy</text>
  <line x1="252" y1="101" x2="268" y2="101" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <rect x="392" y="70" width="108" height="62" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="446.0" y="93.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Distributor</text>
  <text x="446.0" y="105.9" text-anchor="middle" font-size="8.5" fill="#1e40af">스트림 라벨 해석</text>
  <text x="446.0" y="117.3" text-anchor="middle" font-size="8.5" fill="#1e40af">hash ring → ingester</text>
  <line x1="376" y1="101" x2="392" y2="101" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <rect x="516" y="70" width="108" height="62" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="570.0" y="93.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Ingestion 제한</text>
  <text x="570.0" y="105.9" text-anchor="middle" font-size="8.5" fill="#92400e">per_stream_rate_limit</text>
  <text x="570.0" y="117.3" text-anchor="middle" font-size="8.5" fill="#92400e">ingestion_rate_mb</text>
  <line x1="500" y1="101" x2="516" y2="101" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <rect x="640" y="70" width="108" height="62" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="694.0" y="105.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Ingester</text>
  <line x1="624" y1="101" x2="640" y2="101" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <rect x="764" y="70" width="108" height="62" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="818.0" y="93.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Store</text>
  <text x="818.0" y="105.9" text-anchor="middle" font-size="8.5" fill="#1e40af">TSDB /</text>
  <text x="818.0" y="117.3" text-anchor="middle" font-size="8.5" fill="#1e40af">boltdb-shipper</text>
  <line x1="748" y1="101" x2="764" y2="101" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <rect x="516" y="170" width="108" height="40" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="570.0" y="188.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">초과 시 discard</text>
  <text x="570.0" y="200.6" text-anchor="middle" font-size="8.5" fill="#991b1b">HTTP 429</text>
  <line x1="570" y1="132" x2="570" y2="170" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-red)"/>
  <text x="20" y="158" text-anchor="start" font-size="10" font-weight="bold" fill="#92400e">■ 조정한 지점</text>
  <rect x="20" y="236" width="520" height="186" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="36" y="260" font-size="12.5" font-weight="bold" fill="#78350f">limits_config 단계적 증설 (기존 → 1차 → 최종)</text>
  <text x="40" y="290" text-anchor="start" font-size="10" font-weight="bold" fill="#92400e">항목</text>
  <text x="330" y="290" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">기존</text>
  <text x="400" y="290" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">1차</text>
  <text x="470" y="290" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">최종</text>
  <text x="40" y="316" text-anchor="start" font-size="10.5" fill="#92400e">ingestion_rate_mb</text>
  <text x="330" y="316" text-anchor="middle" font-size="10.5" fill="#92400e">3</text>
  <text x="400" y="316" text-anchor="middle" font-size="10.5" fill="#92400e">13</text>
  <text x="470" y="316" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">30</text>
  <text x="40" y="342" text-anchor="start" font-size="10.5" fill="#92400e">ingestion_burst_size_mb</text>
  <text x="330" y="342" text-anchor="middle" font-size="10.5" fill="#92400e">5</text>
  <text x="400" y="342" text-anchor="middle" font-size="10.5" fill="#92400e">20</text>
  <text x="470" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">40</text>
  <text x="40" y="368" text-anchor="start" font-size="10.5" fill="#92400e">per_stream_rate_limit</text>
  <text x="330" y="368" text-anchor="middle" font-size="10.5" fill="#92400e">3MB</text>
  <text x="400" y="368" text-anchor="middle" font-size="10.5" fill="#92400e">5MB</text>
  <text x="470" y="368" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">8MB</text>
  <text x="40" y="394" text-anchor="start" font-size="10.5" fill="#92400e">per_stream_rate_limit_burst</text>
  <text x="330" y="394" text-anchor="middle" font-size="10.5" fill="#92400e">5MB</text>
  <text x="400" y="394" text-anchor="middle" font-size="10.5" fill="#92400e">20MB</text>
  <text x="470" y="394" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">20MB</text>
  <rect x="560" y="236" width="320" height="186" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="576" y="260" font-size="12.5" font-weight="bold" fill="#1e3a8a">관측 (Prometheus · LogQL)</text>
  <rect x="580" y="280" width="280" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="720.0" y="295.8" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">loki_distributor_bytes_received_total</text>
  <text x="720.0" y="307.6" text-anchor="middle" font-size="8.5" fill="#1e40af">수신량</text>
  <rect x="580" y="326" width="280" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="720.0" y="341.8" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">loki_discarded_bytes_total</text>
  <text x="720.0" y="353.6" text-anchor="middle" font-size="8.5" fill="#1e40af">drop량 → 추가 증설 여부 판단</text>
  <rect x="580" y="372" width="280" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="720.0" y="387.6" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e3a8a">{app=~"loki|promtail"} |= "sending batch"</text>
  <text x="720.0" y="399.3" text-anchor="middle" font-size="8.5" fill="#1e40af">실제 배치 전송 크기 확인</text>
</svg>
