<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 390" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1150" height="390" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- ============ 변경 전 ============ -->
  <text x="20" y="24" font-size="13" font-weight="bold" fill="#111827">변경 전 — 노드별 개별 MAC 광고</text>

  <rect x="20" y="45" width="90" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="65" y="70" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Client</text>
  <line x1="110" y1="65" x2="160" y2="65" stroke="#334155" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="135" y="57" text-anchor="middle" font-size="8.5" fill="#64748b">ARP 갱신</text>
  <rect x="160" y="45" width="90" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="205" y="70" text-anchor="middle" font-size="10.5" fill="#7c2d12">NAC</text>

  <!-- 4 uniform node boxes -->
  <line x1="250" y1="58" x2="300" y2="30" stroke="#dc2626" stroke-width="1.3" marker-end="url(#a1)"/>
  <line x1="250" y1="62" x2="300" y2="66" stroke="#dc2626" stroke-width="1.3" marker-end="url(#a1)"/>
  <line x1="250" y1="68" x2="300" y2="102" stroke="#dc2626" stroke-width="1.3" marker-end="url(#a1)"/>
  <line x1="250" y1="72" x2="300" y2="138" stroke="#dc2626" stroke-width="1.3" marker-end="url(#a1)"/>

  <rect x="300" y="15" width="140" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="370" y="34" text-anchor="middle" font-size="9.5" fill="#7f1d1d">Node A · MAC 광고</text>
  <rect x="300" y="51" width="140" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="370" y="70" text-anchor="middle" font-size="9.5" fill="#7f1d1d">Node B · MAC 광고</text>
  <rect x="300" y="87" width="140" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="370" y="106" text-anchor="middle" font-size="9.5" fill="#7f1d1d">Node C · MAC 광고</text>
  <rect x="300" y="123" width="140" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="370" y="142" text-anchor="middle" font-size="9.5" fill="#7f1d1d">Node D · MAC 광고</text>

  <text x="480" y="20" font-size="8.5" fill="#991b1b">매번 다른 노드로</text>
  <rect x="480" y="50" width="230" height="65" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="595" y="73" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">목적지 노드 매 갱신마다 변경</text>
  <text x="595" y="89" text-anchor="middle" font-size="9.5" fill="#991b1b">MQTT peer IP 불일치 → 커넥션 강제 종료</text>
  <text x="595" y="103" text-anchor="middle" font-size="9.5" fill="#991b1b">메신저 접속 반복 끊김</text>

  <!-- Divider -->
  <line x1="20" y1="180" x2="1130" y2="180" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============ 변경 후 ============ -->
  <text x="20" y="204" font-size="13" font-weight="bold" fill="#111827">변경 후 — MetalLB(L2) 단일 노드 광고</text>

  <rect x="20" y="225" width="90" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="65" y="250" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Client</text>
  <line x1="110" y1="245" x2="160" y2="245" stroke="#334155" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="135" y="237" text-anchor="middle" font-size="8.5" fill="#64748b">ARP 갱신</text>
  <rect x="160" y="225" width="90" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="205" y="250" text-anchor="middle" font-size="10.5" fill="#7c2d12">NAC</text>

  <!-- 4 uniform node boxes, only Leader gets the advertising arrow -->
  <line x1="250" y1="238" x2="300" y2="210" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="300" y="195" width="140" height="30" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="370" y="214" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">Node A · Leader (MAC 광고)</text>
  <rect x="300" y="231" width="140" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="370" y="250" text-anchor="middle" font-size="9.5" fill="#64748b">Node B · standby</text>
  <rect x="300" y="267" width="140" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="370" y="286" text-anchor="middle" font-size="9.5" fill="#64748b">Node C · standby</text>
  <rect x="300" y="303" width="140" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="370" y="322" text-anchor="middle" font-size="9.5" fill="#64748b">Node D · standby</text>

  <text x="480" y="200" font-size="8.5" fill="#166534">항상 동일 노드</text>
  <rect x="480" y="230" width="230" height="60" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="595" y="255" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">목적지 노드 고정</text>
  <text x="595" y="271" text-anchor="middle" font-size="9.5" fill="#166534">TCP 커넥션 유지, 재발 없음</text>

  <text x="20" y="358" font-size="10" fill="#64748b">원인 배제 과정: 패킷 덤프로 보안프로그램 / IP 대역 / MTU(서버 1500 vs 스위치 1514)를 순차 배제해 NAC ARP × 개별 MAC 광고로 특정</text>
  <text x="20" y="374" font-size="10" fill="#64748b">도입 전(10/17)·후(10/23) 노드별 리소스 사용 그래프 비교로 단일 노드 고정 확인 — 이후 전체 고객사 배포 표준으로 반영</text>
</svg>
