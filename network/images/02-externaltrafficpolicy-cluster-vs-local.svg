<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#111827">Traefik 서비스 externalTrafficPolicy — Cluster vs Local</text>
  <rect x="20" y="48" width="420" height="364" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="36" y="72" font-size="12.5" font-weight="bold" fill="#7f1d1d">AS-IS · 미지정(기본값 Cluster)</text>
  <text x="36" y="90" font-size="10.5" fill="#991b1b">다른 노드의 Pod로도 전달</text>
  <rect x="170" y="92" width="120" height="36" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="230.0" y="108.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">Client</text>
  <text x="230.0" y="120.6" text-anchor="middle" font-size="8.5" fill="#991b1b">원본 IP: C</text>
  <rect x="40" y="170" width="180" height="150" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="130.0" y="249.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d"></text>
  <text x="54" y="190" text-anchor="start" font-size="10.5" font-weight="bold" fill="#991b1b">Node A (트래픽 수신)</text>
  <rect x="240" y="170" width="180" height="150" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="330.0" y="249.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d"></text>
  <text x="254" y="190" text-anchor="start" font-size="10.5" font-weight="bold" fill="#991b1b">Node B</text>
  <rect x="56" y="204" width="148" height="40" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="130.0" y="222.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">kube-proxy</text>
  <text x="130.0" y="234.6" text-anchor="middle" font-size="8.5" fill="#991b1b">SNAT: C → 노드 IP</text>
  <rect x="256" y="262" width="148" height="44" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="330.0" y="282.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">Traefik Pod</text>
  <text x="330.0" y="294.6" text-anchor="middle" font-size="8.5" fill="#991b1b">수신 IP: 노드 IP</text>
  <line x1="204" y1="234" x2="256" y2="280" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-red)"/>
  <line x1="210" y1="128" x2="130" y2="204" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-red)"/>
  <rect x="40" y="340" width="380" height="50" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="230.0" y="363.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">로그인내역 / 메뉴사용내역</text>
  <text x="230.0" y="375.8" text-anchor="middle" font-size="9" fill="#991b1b">클라이언트 IP 대신 Pod IP 기록</text>
  <rect x="460" y="48" width="420" height="364" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="476" y="72" font-size="12.5" font-weight="bold" fill="#14532d">TO-BE · externalTrafficPolicy: Local</text>
  <text x="476" y="90" font-size="10.5" fill="#166534">수신 노드의 로컬 Pod로만 전달</text>
  <rect x="610" y="92" width="120" height="36" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="670.0" y="108.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Client</text>
  <text x="670.0" y="120.6" text-anchor="middle" font-size="8.5" fill="#166534">원본 IP: C</text>
  <rect x="480" y="170" width="180" height="150" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="570.0" y="249.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d"></text>
  <text x="494" y="190" text-anchor="start" font-size="10.5" font-weight="bold" fill="#166534">Node A (트래픽 수신)</text>
  <rect x="680" y="170" width="180" height="150" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="770.0" y="249.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d"></text>
  <text x="694" y="190" text-anchor="start" font-size="10.5" font-weight="bold" fill="#166534">Node B</text>
  <rect x="496" y="204" width="148" height="40" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="570.0" y="222.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">kube-proxy</text>
  <text x="570.0" y="234.6" text-anchor="middle" font-size="8.5" fill="#166534">SNAT 없음</text>
  <rect x="496" y="262" width="148" height="44" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="570.0" y="282.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Traefik Pod</text>
  <text x="570.0" y="294.6" text-anchor="middle" font-size="8.5" fill="#166534">수신 IP: C</text>
  <line x1="570" y1="244" x2="570" y2="262" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
  <line x1="650" y1="128" x2="570" y2="204" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
  <rect x="480" y="340" width="380" height="50" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="670.0" y="363.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">로그인내역 / 메뉴사용내역</text>
  <text x="670.0" y="375.8" text-anchor="middle" font-size="9" fill="#166534">실제 클라이언트 IP 기록</text>
</svg>
