<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#111827">커널 IPv6 비활성화 × 애플리케이션 바인딩 — 듀얼스택 vs IPv4 단일스택</text>
  <rect x="20" y="48" width="420" height="334" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="36" y="72" font-size="12.5" font-weight="bold" fill="#7f1d1d">AS-IS · 커널과 앱 설정 불일치</text>
  <rect x="40" y="92" width="380" height="44" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="230.0" y="112.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">커널</text>
  <text x="230.0" y="124.8" text-anchor="middle" font-size="9" fill="#991b1b">ipv6.disable=1</text>
  <rect x="40" y="164" width="180" height="60" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="130.0" y="186.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">애플리케이션</text>
  <text x="130.0" y="198.9" text-anchor="middle" font-size="8.5" fill="#991b1b">listen [::]:80 (IPv6)</text>
  <text x="130.0" y="210.3" text-anchor="middle" font-size="8.5" fill="#991b1b">→ 기동 실패</text>
  <rect x="240" y="164" width="180" height="60" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="330.0" y="186.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">마스터 컴포넌트</text>
  <text x="330.0" y="198.9" text-anchor="middle" font-size="8.5" fill="#991b1b">bind 0.0.0.0</text>
  <text x="330.0" y="210.3" text-anchor="middle" font-size="8.5" fill="#991b1b">(모든 인터페이스)</text>
  <line x1="130" y1="136" x2="130" y2="164" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-red)"/>
  <rect x="40" y="260" width="380" height="44" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="230.0" y="280.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">네트워크 스택</text>
  <text x="230.0" y="292.8" text-anchor="middle" font-size="9" fill="#991b1b">IPv4/IPv6 듀얼스택 설정 잔존</text>
  <rect x="460" y="48" width="420" height="334" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="476" y="72" font-size="12.5" font-weight="bold" fill="#14532d">TO-BE · IPv4 단일스택 통일</text>
  <rect x="480" y="92" width="380" height="44" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="670.0" y="112.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">커널</text>
  <text x="670.0" y="124.8" text-anchor="middle" font-size="9" fill="#166534">ipv6.disable=1 (고객사 설정 유지)</text>
  <rect x="480" y="164" width="180" height="60" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="570.0" y="186.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">애플리케이션</text>
  <text x="570.0" y="198.9" text-anchor="middle" font-size="8.5" fill="#166534">IPv4 소켓으로만 바인딩</text>
  <text x="570.0" y="210.3" text-anchor="middle" font-size="8.5" fill="#166534">→ 정상 기동</text>
  <rect x="680" y="164" width="180" height="60" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="770.0" y="192.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">마스터 컴포넌트</text>
  <text x="770.0" y="204.6" text-anchor="middle" font-size="8.5" fill="#166534">광범위 바인딩 제거</text>
  <line x1="570" y1="136" x2="570" y2="164" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
  <rect x="480" y="260" width="380" height="44" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="670.0" y="280.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">네트워크 스택</text>
  <text x="670.0" y="292.8" text-anchor="middle" font-size="9" fill="#166534">IPv4 단일스택</text>
</svg>
