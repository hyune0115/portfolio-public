<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="20" y="26" font-size="13" font-weight="bold" fill="#111827">WebSocket Upgrade 핸드셰이크 — 정상 vs 실패 구간 대조</text>

  <!-- Column headers -->
  <text x="90" y="55" font-size="11.5" font-weight="bold" fill="#334155">Client</text>
  <text x="410" y="55" font-size="11.5" font-weight="bold" fill="#334155">A10 (SSL-Offload)</text>
  <text x="740" y="55" font-size="11.5" font-weight="bold" fill="#334155">Backend (MQTT/WS)</text>

  <line x1="100" y1="65" x2="100" y2="430" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="450" y1="65" x2="450" y2="430" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="800" y1="65" x2="800" y2="430" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Case 1: A10 internal direct call to backend -->
  <rect x="30" y="75" width="840" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="50" y="95" font-size="11.5" font-weight="bold" fill="#14532d">Case 1 — A10에서 Backend로 직접 재호출 (Client 구간 제외, 검증용)</text>

  <line x1="450" y1="115" x2="800" y2="115" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <text x="470" y="110" font-size="10" fill="#166534">GET /mqtt HTTP/1.1 · Connection: Upgrade · Upgrade: websocket</text>

  <line x1="800" y1="150" x2="450" y2="150" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <text x="470" y="145" font-size="10" fill="#166534">101 Switching Protocols</text>

  <line x1="450" y1="185" x2="800" y2="185" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="470" y="180" font-size="10" fill="#166534">WebSocket 프레임 통신 정상 — Backend 자체는 문제 없음 확인</text>

  <text x="105" y="175" font-size="9.5" fill="#94a3b8">(Client 구간 미사용)</text>

  <!-- Case 2: Client -> A10 -> Backend, failure isolated to Client<->A10 -->
  <rect x="30" y="225" width="840" height="195" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="50" y="245" font-size="11.5" font-weight="bold" fill="#7f1d1d">Case 2 — Client → A10 → Backend (실제 서비스 경로)</text>

  <line x1="100" y1="265" x2="450" y2="265" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="120" y="260" font-size="10" fill="#991b1b">GET /mqtt HTTP/1.1 · Connection: Upgrade · Upgrade: websocket</text>

  <rect x="380" y="285" width="140" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="395" y="303" font-size="9.5" fill="#7f1d1d">프로토콜 타입: HTTP</text>
  <text x="395" y="317" font-size="9.5" fill="#7f1d1d">Upgrade 헤더 무시</text>

  <line x1="800" y1="345" x2="450" y2="345" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="470" y="340" font-size="9.5" fill="#64748b">(Backend는 Case 1에서 정상 확인됨 — 이 구간은 문제 아님)</text>

  <line x1="450" y1="380" x2="100" y2="380" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="120" y="375" font-size="10" fill="#991b1b">일반 HTTP 응답 (101 아님) → WebSocket 핸드셰이크 실패</text>

  <!-- Highlight the failing segment -->
  <rect x="100" y="255" width="350" height="135" rx="6" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="105" y="405" font-size="10.5" font-weight="bold" fill="#b91c1c">↑ Client ↔ A10 구간에서만 발생 — 문제 지점</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
