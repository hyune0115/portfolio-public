<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="20" y="26" font-size="13" font-weight="bold" fill="#111827">WebSocket Upgrade 핸드셰이크 — 정상 vs A10 경유</text>

  <!-- Column headers -->
  <text x="90" y="55" font-size="11.5" font-weight="bold" fill="#334155">Client</text>
  <text x="410" y="55" font-size="11.5" font-weight="bold" fill="#334155">A10 (SSL-Offload)</text>
  <text x="740" y="55" font-size="11.5" font-weight="bold" fill="#334155">Backend (MQTT/WS)</text>

  <line x1="100" y1="65" x2="100" y2="430" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="450" y1="65" x2="450" y2="430" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="800" y1="65" x2="800" y2="430" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Case 1: bypass direct call -->
  <rect x="30" y="75" width="840" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="50" y="95" font-size="11.5" font-weight="bold" fill="#14532d">Case 1 — 백엔드 직접 호출 (A10 우회)</text>

  <line x1="100" y1="115" x2="800" y2="115" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <text x="120" y="110" font-size="10" fill="#166534">GET /mqtt HTTP/1.1 · Connection: Upgrade · Upgrade: websocket</text>

  <line x1="800" y1="150" x2="100" y2="150" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <text x="120" y="145" font-size="10" fill="#166534">101 Switching Protocols</text>

  <line x1="100" y1="185" x2="800" y2="185" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="120" y="180" font-size="10" fill="#166534">WebSocket 프레임 통신 (동일 TCP 커넥션 유지)</text>

  <!-- Case 2: via A10 -->
  <rect x="30" y="225" width="840" height="185" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="50" y="245" font-size="11.5" font-weight="bold" fill="#7f1d1d">Case 2 — A10 경유 (프로토콜 타입: HTTP 고정)</text>

  <line x1="100" y1="265" x2="450" y2="265" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="120" y="260" font-size="10" fill="#991b1b">GET /mqtt HTTP/1.1 · Connection: Upgrade · Upgrade: websocket</text>

  <rect x="380" y="285" width="140" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="395" y="303" font-size="9.5" fill="#7f1d1d">프로토콜 타입: HTTP</text>
  <text x="395" y="317" font-size="9.5" fill="#7f1d1d">Upgrade 헤더 무시</text>

  <line x1="450" y1="340" x2="800" y2="340" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="470" y="335" font-size="10" fill="#991b1b">일반 HTTP 요청으로 강제 변환되어 전달</text>

  <line x1="800" y1="375" x2="100" y2="375" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="120" y="370" font-size="10" fill="#991b1b">일반 HTTP 응답 (101 아님) → WebSocket 핸드셰이크 실패</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
